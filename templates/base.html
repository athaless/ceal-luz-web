<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CEAL / LUZ | {% block title %}Sistema de gestão{% endblock %}</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f4;color:#20352f;font:16px system-ui,sans-serif}header{background:#244e43;color:white;padding:20px 6%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header span{font-size:13px;color:#d4e5dc}main{max-width:960px;margin:48px auto;padding:0 20px}.panel{background:white;border:1px solid #dbe5df;border-radius:14px;padding:32px;box-shadow:0 8px 30px #20352f0b}.login{max-width:440px;margin:auto}h1{font-size:28px;margin-top:0}p{line-height:1.6}label{display:block;font-weight:600;margin-bottom:6px}input{width:100%;padding:12px;border:1px solid #aabdb4;border-radius:6px;font:inherit}button,.button{display:inline-block;background:#286550;color:white;border:0;border-radius:7px;padding:11px 18px;font:inherit;text-decoration:none;cursor:pointer}header button{background:#ffffff20}a{color:#286550}.muted{color:#5c7168}.errorlist{color:#a32727;padding-left:20px}footer{text-align:center;color:#5c7168;font-size:13px;padding:24px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:24px 0}.tile{background:#f1f5f4;padding:20px;border-radius:8px}
</style></head><body>
<header><div><strong>CEAL / LUZ</strong><br><span>Sistema de gestão institucional</span></div>{% if user.is_authenticated %}<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Sair</button></form>{% endif %}</header>
<main>{% block content %}{% endblock %}</main><footer>CEAL / LUZ · Fundação do sistema</footer></body></html>
